{% extends "base.html" %}
{% block titulo %}Registrar empleado{% endblock %}
{% block contenido %}
<div class="pagina-cab"><div><h1>Registrar empleado</h1><p class="sub">Al guardar se crea su expediente con todos los documentos pendientes.</p></div></div>
<div class="card form-card">
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST" action="/empleados/nuevo">
  <div class="form-grid">
    <div><label>Código de empleado</label><input type="text" value="Se genera automáticamente (HDD-0000)" disabled></div>
    <div><label>Nombre del colaborador</label><input type="text" name="nombre" value="{{ datos.nombre }}" maxlength="100"></div>
    <div><label>Puesto</label>
      <select name="puesto">
        <option value="">-- Selecciona --</option>
        {% for x in puestos %}
        <option value="{{ x }}" {% if datos.puesto == x %}selected{% endif %}>{{ x }}</option>
        {% endfor %}
      </select></div>
    <div><label>Área o departamento</label>
      <select name="area">
        <option value="">-- Selecciona --</option>
        {% for x in areas %}
        <option value="{{ x }}" {% if datos.area == x %}selected{% endif %}>{{ x }}</option>
        {% endfor %}
      </select></div>
    <div><label>Sucursal</label>
      <select name="sucursal">
        <option value="">-- Selecciona --</option>
        {% for x in sucursales %}
        <option value="{{ x }}" {% if datos.sucursal == x %}selected{% endif %}>{{ x }}</option>
        {% endfor %}
      </select></div>
    <div><label>Estado laboral</label>
      <select name="estado">
        <option value="">-- Selecciona --</option>
        {% for x in estados %}
        <option value="{{ x }}" {% if datos.estado == x %}selected{% endif %}>{{ x }}</option>
        {% endfor %}
      </select></div>
    <div><label>Fecha de ingreso</label><input type="date" name="fecha_ingreso" value="{{ datos.fecha_ingreso }}"></div>
  </div>
  <div class="form-pie">
    <button type="submit">Guardar empleado</button>
    <a class="boton secundario" href="/empleados">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
